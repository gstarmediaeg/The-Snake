<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARESI GROUP — Signal Error</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at center, #202020, #090909 55%, #000);
  font-family: "Courier New", monospace;
  color: #fff;
}

.tv {
  width: min(96vw, 1100px);
  aspect-ratio: 4 / 3;
  max-height: 94vh;
  padding: 4.5%;
  position: relative;
  border-radius: 7%;
  background: linear-gradient(145deg, #444, #171717 25%, #292929 55%, #080808);
  box-shadow: 0 35px 70px #000b, inset 0 2px 3px #ffffff25;
}

.screen {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  border-radius: 9%;
  background: #050505;
  box-shadow: inset 0 0 30px #000, 0 0 0 5px #111;
  isolation: isolate;
}

.screen::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    #ffffff0a 0px,
    #ffffff0a 1px,
    transparent 2px,
    transparent 4px
  );
}

.screen::after {
  content: "";
  position: absolute;
  inset: -10%;
  z-index: 6;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    transparent 48%,
    #000b 100%
  );
}

.error {
  position: absolute;
  top: 9%;
  width: 100%;
  text-align: center;
  color: #f2f2f2;
  z-index: 2;
  font-size: clamp(13px, 2.2vw, 25px);
  letter-spacing: .18em;
  text-shadow: 0 0 8px #ffffff65;
  animation: flicker 4s infinite;
}

.error strong {
  display: block;
  font-size: 1.35em;
  margin-bottom: .35em;
}

.error span {
  font-size: .68em;
  opacity: .78;
}

.logo {
  position: absolute;
  top: 0;
  left: 0;
  width: clamp(155px, 43%, 390px);
  height: auto;
  z-index: 3;
  pointer-events: none;
  will-change: transform;
}

.logo img {
  display: block;
  width: 100%;
  height: auto;
}

.status {
  position: absolute;
  bottom: 4%;
  left: 4%;
  z-index: 7;
  color: #bdbdbd;
  font-size: clamp(8px, 1vw, 11px);
  letter-spacing: .12em;
}

.power {
  position: absolute;
  bottom: 2%;
  right: 5%;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #075bff;
  box-shadow: 0 0 10px #075bff;
  animation: pulse 1.5s infinite;
}

@keyframes flicker {
  0%, 94%, 96%, 100% { opacity: 1; }
  95% { opacity: .45; }
  97% { opacity: .8; }
}

@keyframes pulse {
  50% { opacity: .35; }
}

@media (max-width: 600px) {
  .tv {
    width: 98vw;
    padding: 5%;
  }

  .logo {
    width: 48%;
  }
}
</style>
</head>

<body>
<main class="tv">
  <div class="screen" id="screen">

    <div class="error">
      <strong>ERROR OCCURRED</strong>
      <span>PLEASE CHECK THE SIGNAL</span>
    </div>

    <div class="logo" id="logo">
      <img id="logoImage" alt="FARESI GROUP Logo">
    </div>

    <div class="status">NO SIGNAL / CH 00</div>
    <div class="power"></div>

  </div>
</main>

<script>
const screen = document.getElementById("screen");
const logo = document.getElementById("logo");
const logoImage = document.getElementById("logoImage");

/* ضع رابط صورة اللوجو الأبيض والأزرق هنا */
const whiteLogo = "assets/images/faresi-white.png";
const blueLogo = "assets/images/faresi-blue.png";

const logos = [whiteLogo, blueLogo];

let x = 24;
let y = 22;
let vx = 2.4;
let vy = 1.8;
let colorIndex = 0;
let lastTime = 0;

logoImage.src = logos[0];

function animate(time) {
  if (!lastTime) lastTime = time;

  const delta = Math.min((time - lastTime) / 16.67, 2);
  lastTime = time;

  const maxX = Math.max(0, screen.clientWidth - logo.offsetWidth);
  const maxY = Math.max(0, screen.clientHeight - logo.offsetHeight);

  x += vx * delta;
  y += vy * delta;

  let hit = false;

  if (x <= 0) {
    x = 0;
    vx = Math.abs(vx);
    hit = true;
  } else if (x >= maxX) {
    x = maxX;
    vx = -Math.abs(vx);
    hit = true;
  }

  if (y <= 0) {
    y = 0;
    vy = Math.abs(vy);
    hit = true;
  } else if (y >= maxY) {
    y = maxY;
    vy = -Math.abs(vy);
    hit = true;
  }

  if (hit) {
    colorIndex = 1 - colorIndex;
    logoImage.src = logos[colorIndex];
  }

  logo.style.transform = `translate(${x}px, ${y}px)`;

  requestAnimationFrame(animate);
}

window.addEventListener("resize", () => {
  x = Math.min(x, Math.max(0, screen.clientWidth - logo.offsetWidth));
  y = Math.min(y, Math.max(0, screen.clientHeight - logo.offsetHeight));
});

requestAnimationFrame(animate);
</script>
</body>
  </html>
